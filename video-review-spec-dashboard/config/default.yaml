# 通用默认配置：与测评品类无关的阈值与规则
# 品类专属内容（品牌表、字段表、底部栏区域等）一律写在 config/presets/<名称>.yaml
# 本文件复制后按需覆盖，不要直接修改本文件的通用默认值

# ------------------------------------------------------------
# 几何配对参数
# 铁律 M4：先按 |Δy| 取最近行，同行内再按 x 拼接
# 反例教训：若改成"按 x 排序取最近"，会误取到下一行的补充说明，
#          曾导致 5 台机型的刷新率全部解析错误
# ------------------------------------------------------------
geometry:
  # 值必须位于标签右侧至少这么多像素之外
  dx_min: 40
  # 值与标签的垂直距离上限（超过则视为不同行）
  dy_max: 42
  # 判定"同一行"时允许的额外垂直抖动
  row_tol: 8

# ------------------------------------------------------------
# 参数卡判定
# ------------------------------------------------------------
card:
  # 一帧至少识别出几个字段标签，才判定为参数卡（低于此值的帧直接跳过）
  min_labels: 4
  # 标题行（品牌+型号所在）的纵向上限，单位像素
  # 默认 150 对应 1080p 画面顶部约 14%；若视频是其他分辨率，按同比例换算后覆盖此值
  title_max_y: 150

# ------------------------------------------------------------
# OCR 画面分区（04 阶段）
# box 是比例坐标 [x1, y1, x2, y2]，取值 0-1，按实际分辨率换算成像素
# order 决定识别顺序（不靠 YAML 书写顺序——两层配置合并后顺序会变）
# role 供版式探查分组与配置校验使用：main / footer_label / footer_value / subtitle
#
# 品类专属区域（如底部横排栏的分段）写在 preset 的 ocr.regions 里，
# 会与本段合并；同名键由 preset 覆盖。
# ------------------------------------------------------------
ocr:
  regions:
    # 参数卡主区：绝大多数字段标签与值都在这里
    card_main:
      box: [0.02, 0.05, 0.98, 0.86]
      role: main
      order: 0
    # 口播字幕：单独识别，用于章节定位
    subtitle:
      box: [0.02, 0.86, 0.98, 0.999]
      role: subtitle
      order: 90

# ------------------------------------------------------------
# 值解析通用规则
# ------------------------------------------------------------
parse:
  # 兜底短文本的最大长度：未命中任何类型时，长度不超过此值则原样收录
  fallback_text_max_len: 24
  # 同一字段在不同帧出现不同值时，是否记录冲突（true=记录并保留现值，交人工处理）
  keep_conflicts: true

# ------------------------------------------------------------
# 渲染规则（M8 铁律：缺失一律标「未提取」，不填 0、不推测填充）
# ------------------------------------------------------------
render:
  missing_label: "未提取"
  # 看板中是否内联 ECharts（CDN 不可达时必须为 true）
  inline_echarts: true
  # inline_echarts=false 时使用的 CDN 地址
  # 注意：本机 jsdelivr 不可达，改 false 前请先确认该地址可用，
  #       否则图表会一片空白且不报错（见 troubleshooting 第 3 条）
  echarts_cdn_url: "https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"
  # 缺失值在图表中的处理方式：gap（留空）或 zero（补零）
  # 默认必须是 gap —— 补零会让"没数据"看起来像"真的是 0"（铁律 M8）
  missing_in_chart: "gap"

# ------------------------------------------------------------
# 看板的两个可选板块
# 与品类相关的部分（档位、核心指标）写在 preset 的 dashboard 里，
# 这里只放与品类无关的开关；preset 同名键覆盖本段
# ------------------------------------------------------------
dashboard:
  # 选购建议：人工写的解读，不是自动生成
  # 自动生成的"建议"会把口径陷阱当成结论输出，所以必须由人来写
  # 格式：[{title, level: good|warn, items: [文本, ...]}]，留空则不渲染该板块
  advice: []
  special_section:
    # 特殊技术特性板块开关；为 true 且数据里确有 specials 时才出现
    enabled: false
    title: "特殊技术特性"
    desc: "各条目独有的技术，按类型归类。这些是同档位内的差异化要素。"
    # 归类维度：type=按技术类型，owner=按归属品牌
    group_by: "type"
    # 需要高亮显示的品牌（chip 标红）。留空则全部统一配色
    highlight_brands: []

# ------------------------------------------------------------
# 输出文件名（各阶段产物）
# 消费者：pipeline 用这些名字拼默认路径；各脚本读同名键保持读写一致
# ------------------------------------------------------------
output:
  # 视频探测结果（01 写）
  video_info_json: "video_info.json"
  # 16kHz 音频（01 写、02 读）
  audio_wav: "audio_16k.wav"
  # 转写结果（02 写、10 读）
  transcript_json: "transcript.json"
  transcript_txt: "transcript.txt"
  # 关键帧子目录名（03 写、04/07 读）
  frames_dir: "frames"
  keyframes_json: "keyframes.json"
  frames_ocr_json: "frames_ocr.json"
  # 版式探查报告（05 写）
  layout_report: "layout_report.md"
  models_json: "models.json"
  # 核对拼图的前缀，实际文件名是 <前缀>_<序号>_<品牌>.jpg
  contact_sheet_prefix: "contact_sheet"
  specs_csv: "specs.csv"
  specs_table_html: "specs_table.html"
  dashboard_html: "dashboard.html"
  # 章节定位（10 写，当前无下游消费，供人工定位用）
  chapters_json: "chapters.json"

# ------------------------------------------------------------
# 视频查找（pipeline 用）
# 优先级：--video 显式给出 > 环境变量 VRSD_VIDEO > 本段配置 > 项目目录内递归
# ------------------------------------------------------------
search:
  # 额外的视频搜索目录。默认为空：不猜测任何用户专属目录（如 Downloads）
  video_dirs: []
  video_exts: ["mp4", "mkv", "mov"]

# ------------------------------------------------------------
# 抽帧参数（03 阶段，与品类无关）
# ------------------------------------------------------------
keyframes:
  # 每隔多少秒检查一次画面（越小越密，抽帧越慢）
  interval: 1.0
  # 帧间平均像素差低于此值则视为「画面没变」，跳过该帧
  # 实测：1929s 视频共 57868 帧，按此阈值只保留 226 帧（压缩比 256:1）
  diff_threshold: 12.0
  # 差异计算前的灰度降采样倍率（8 = 每 8 行/列取一个像素）
  downsample: 8
  # JPEG 保存质量
  jpeg_quality: 88

# ------------------------------------------------------------
# 章节定位（10 阶段，可选）
# 词表是测评视频的通用话术，品类有专属说法时在 preset 里覆盖
# 顺序敏感：每个片段/文本框只取第一个命中的词表项
# ------------------------------------------------------------
chapters:
  # 音频线索与已有画面线索相距在此秒数内，视为重复，丢弃音频线索
  audio_dedupe_sec: 3
  # 两个章节起点的最小间隔（秒），更近的合并
  min_gap_sec: 20
  # 音频线索的兜底置信度（画面线索带真实 OCR 置信度，更可靠）
  fallback_score: 0.5
  # 章节名截断长度
  name_max_len: 30
  audio_patterns:
    - {pattern: '第\s*([一二三四五六七八九十\d])\s*档', kind: "档位序号"}
    - {pattern: '(\d{3,5})\s*(?:块钱|块|元)?\s*(?:档|这一档)', kind: "档位价格"}
    - {pattern: '(\d{3,5})\s*到\s*(\d{3,5})', kind: "价格区间"}
    - {pattern: '(\d{3,5})\s*档', kind: "档位价格"}
    - {pattern: '小结|总结|收尾|总结一下', kind: "段落标记"}
  visual_patterns:
    - {pattern: '第[一二三四五六七八九十]\s*档', kind: "档位卡"}
    - {pattern: '\d{3,5}\s*元档', kind: "档位卡"}
    - {pattern: '\d{3,5}\s*[-—~至到]\s*\d{3,5}\s*元', kind: "价格区间"}
