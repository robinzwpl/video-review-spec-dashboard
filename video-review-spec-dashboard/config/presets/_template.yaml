# ============================================================
# 新品类预设模板
#
# 用法：复制本文件为 config/presets/<你的品类>.yaml，然后只改标注【必填】的部分
# 不会填的就留空，留空的段落会被跳过，不影响主流程
# 不确定画面版式时，先跑 scripts/05_discover.py 看版式报告，里面会给出建议值
# ============================================================

meta:
  name: <品类名称，如 phone_2026>
  title: "看板标题"
  author: "视频作者"
  source_date: "YYYY-MM-DD"
  note: "一句话说明这批数据是什么"

# ------------------------------------------------------------
# 干扰帧排除
# 开篇常有「全部机型一起看」的总览页，多条目同屏必然错配，
# 填总览页结束的时间点（秒），该时间点之前的帧整体不参与解析
# ------------------------------------------------------------
exclude_before_sec: 0.0

# ------------------------------------------------------------
# OCR 文本修正（可选）
# 把 OCR 经常认错的字填进来，先做字面替换，再做正则替换
# ------------------------------------------------------------
ocr_fixes:
  literal: []
  regex: []

# ------------------------------------------------------------
# 身份识别【按需】
# ------------------------------------------------------------
identity:
  # 品牌表：品牌名 -> 匹配正则。留空则不识别品牌，整行标题当型号
  brand_map: {}
  # 标题行剔除词：以这些词开头的行不是型号
  title_noise: []
  # 型号负向词表：命中则不是型号（避免把规格词当成型号）
  model_negative: ""
  # 去掉品牌前缀后，型号里可能残留的栏目字样
  strip_prefix: []
  # 是否剔除型号中的年份（如 2026）
  strip_year: false
  # 型号中遇到这些词即截断（其后通常是价格等无关内容）
  cut_at: ""

# ------------------------------------------------------------
# 字段定义【必填】
#   name    内部字段名
#   label   展示用中文名
#   type    值类型，见 SKILL.md 第 5 节的类型表
#   aliases 画面上可能出现的标签原文（顺序敏感，靠前的先判定）
#
# 不同类型需要的额外参数：
#   enum_map         patterns: [{pattern, name}, ...]
#   percent_std      standards: [{pattern, name}, ...]
#   zones            no_zone_pattern、zone_types、notes{none,exact,range}
#   zones_named      note
#   range_num        notes{range, single}
#   refresh_hz       notes{native, non_native}、boost_field、boost_pattern
#   count_by_version versions: ["2.1", "2.0"]
#   money            note
# ------------------------------------------------------------
fields:
  - name: 价格
    label: "价格"
    type: money
    unit: "元"
    aliases: ["价格", "参考价", "售价"]
    note: ""
  - name: 主参数一
    label: "主参数一"
    type: int_unit
    unit: "个"
    aliases: ["标签原文一", "别名"]

# ------------------------------------------------------------
# 无标签字段兜底（可选）
# 标签没被 OCR 出来、只剩值的时候，用全帧文本兜底匹配
#   ordinal 取第几个匹配（0=第一个），用于「2GB / 64GB」这类复合值
# ------------------------------------------------------------
fallback_extract: []

# ------------------------------------------------------------
# 底部横排栏区域（可选）
# OCR 阶段会按 x 边界把底部切成若干段并标注 region，这里声明每段出哪些字段
# 必须按实测 x 边界切分，等分无效
# ------------------------------------------------------------
footer_regions: {}

# ------------------------------------------------------------
# 特殊技术特性（可选）：整帧文本匹配，命中记入 specials
# ------------------------------------------------------------
specials: []

# ------------------------------------------------------------
# 人工核对确认值（可选）
# 对照 contact sheet 逐项确认后回填，来源会被标记为「用户截图确认」
# 命中方式：机型全名包含 key，或 key 包含机型全名
# ------------------------------------------------------------
overrides: {}

# ------------------------------------------------------------
# 口径备注规则（可选）：命中则记入 notes，用于显式化口径陷阱
# ------------------------------------------------------------
note_rules: []

# ------------------------------------------------------------
# 下游展示
# ------------------------------------------------------------
table:
  field_order: ["价格", "主参数一"]
  extra_columns: ["序号", "品牌", "型号", "档位", "数据来源"]

dashboard:
  price_field: "价格"
  # 档位从数据实际分布推导，不要预设（见 SKILL.md 铁律）
  tiers: []
  # 热力图与柱状图用的核心指标
  metrics:
    - {field: "主参数一", key: "metric1", label: "主参数一"}
  color_std_groups: []
  caveats: []
